<title>Bos!</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
background:radial-gradient(circle at 50% 40%,#2a1a4a,#0d0d14 70%);font-family:system-ui,-apple-system,sans-serif;color:#fff;padding:16px;overflow-x:hidden}
.wrap{position:relative;width:min(340px,80vw);aspect-ratio:1}
.wrap img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:6px solid #ffcc00;box-shadow:0 0 40px rgba(255,204,0,.35);transition:transform .15s}
.playing .wrap img{animation:shake .18s infinite alternate}
@keyframes shake{0%{transform:rotate(-4deg) scale(1.04)}100%{transform:rotate(4deg) scale(1.08)}}
.ring{position:absolute;inset:-6px;border-radius:50%;border:4px solid #ffcc00;opacity:0}
.playing .ring{animation:pulse 1s infinite}
.playing .ring:nth-child(3){animation-delay:.5s}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.45);opacity:0}}
button{font-size:22px;font-weight:800;letter-spacing:1px;padding:18px 48px;border:none;border-radius:999px;cursor:pointer;
background:linear-gradient(180deg,#ffdd33,#ff9900);color:#1a1a1a;box-shadow:0 6px 0 #b36b00,0 10px 24px rgba(0,0,0,.5);transition:transform .08s,box-shadow .08s}
button:disabled{cursor:default}
button:not(:disabled):active{transform:translateY(5px);box-shadow:0 1px 0 #b36b00,0 4px 10px rgba(0,0,0,.5)}
.playing button{background:linear-gradient(180deg,#ff5a5a,#d61f1f);color:#fff;box-shadow:0 6px 0 #8a0f0f,0 10px 24px rgba(0,0,0,.5)}
</style></head>

const b=document.getElementById('btn'),a=document.getElementById('snd'),msg=document.getElementById('msg');
function bytes(){const bin=atob(B64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
let ok=false;
try{a.src=URL.createObjectURL(new Blob([bytes()],{type:'audio/mpeg'}));ok=true;}catch(e){a.src='data:audio/mpeg;base64,'+B64;}
// Web Audio fallback
let ctx=null,buf=null,srcNode=null;
async function waPlay(){
  ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==='suspended')await ctx.resume();
  if(!buf)buf=await new Promise((res,rej)=>ctx.decodeAudioData(bytes().buffer,res,rej));
  srcNode=ctx.createBufferSource();srcNode.buffer=buf;srcNode.connect(ctx.destination);
  srcNode.onended=()=>{srcNode=null;stop();};srcNode.start(0);start();
}
function start(){document.body.classList.add('playing');b.textContent="🔊 ...";msg.textContent='';}
function stop(){document.body.classList.remove('playing');b.textContent='▶ BOS!';busy=false;b.disabled=false;}
let busy=false;
b.onclick=async()=>{
  if(busy)return;            // ijro paytida bosish hech narsa qilmaydi
  busy=true;b.disabled=true;
  try{a.currentTime=0;await a.play();start();}
  catch(e){
    try{await waPlay();}
    catch(e2){busy=false;b.disabled=false;msg.textContent="Ovoz ijro bo'lmadi. Faylni Chrome yoki Safari brauzerida oching va telefon ovozini tekshiring.";}
  }
};
a.onended=stop;
